name: Feature request
description: Suggest an idea for Lazarus
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem or theft scenario does this solve?
      placeholder: "When a thief does X, the phone currently..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should Lazarus behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
